name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Android Build Tools & Platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - name: Generate gradlew jika tidak ada
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=8.4
          fi
          chmod +x gradlew

      - name: Buat gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Generate placeholder icon
        run: |
          python3 << 'PYEOF'
          import os, struct, zlib
          def make_png(size):
              def chunk(name, data):
                  c = struct.pack('>I', len(data)) + name + data
                  return c + struct.pack('>I', zlib.crc32(name + data) & 0xFFFFFFFF)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              raw = b''.join(b'\x00' + bytes([33,150,243]) * size for _ in range(size))
              idat = chunk(b'IDAT', zlib.compress(raw))
              return sig + ihdr + idat + chunk(b'IEND', b'')
          base = 'android/app/src/main/res'
          for d, s in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              p = os.path.join(base, d)
              os.makedirs(p, exist_ok=True)
              png = make_png(s)
              for n in ['ic_launcher.png','ic_launcher_round.png']:
                  open(os.path.join(p,n),'wb').write(png)
          print("Icons created")
          PYEOF

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DroidCamPro-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
