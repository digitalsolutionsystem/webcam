name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Android Build Tools & Platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - name: Generate gradlew jika tidak ada
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=8.4
          fi
          chmod +x gradlew

      - name: Buat gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Generate placeholder icon app
        run: |
          RES=android/app/src/main/res
          declare -A SIZES=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            mkdir -p "$RES/$DIR"
            convert -size ${SIZE}x${SIZE} xc:#2196F3 \
              -fill white -gravity center \
              -pointsize $((SIZE/3)) -annotate 0 "DC" \
              "$RES/$DIR/ic_launcher.png"
            cp "$RES/$DIR/ic_launcher.png" "$RES/$DIR/ic_launcher_round.png"
          done
          echo "Icons generated:"
          find $RES -name "ic_launcher*.png" | sort

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DroidCamPro-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
